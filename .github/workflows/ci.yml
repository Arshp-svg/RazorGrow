name: RazorGrow CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  backend-test:
    name: Backend Tests & Agent Evaluation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      JWT_SECRET_KEY: test_ci_jwt_secret_key_1234567890
      RAZORPAY_KEY_ID: rzp_test_ci_mock
      RAZORPAY_KEY_SECRET: rzp_secret_ci_mock
      RAZORPAY_WEBHOOK_SECRET: rzp_webhook_secret_ci_mock
      GROQ_API_KEY: gsk_ci_mock_key

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic Database Migrations
        run: |
          alembic upgrade head

      - name: Run Pytest Test Suite
        run: |
          python -m pytest -v

      - name: Run Agent Evaluation Benchmark (Day 10)
        run: |
          python agent_eval/eval_runner.py

  frontend-build:
    name: Frontend Typecheck & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          npm ci

      - name: TypeScript Typecheck
        run: |
          npx tsc --noEmit

      - name: Next.js Production Build
        run: |
          npm run build

  security-hygiene:
    name: Secrets & Repository Hygiene Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Check for Committed .env or Private Secrets
        run: |
          echo "Verifying no local .env files are tracked by Git..."
          if git ls-files | grep -E '(^|/)\.env$'; then
            echo "ERROR: Tracked .env file detected in git!"
            exit 1
          fi
          echo "Verified: No .env committed."
